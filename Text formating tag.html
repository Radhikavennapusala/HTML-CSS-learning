<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">     
    <title>formating tags</title>
</head>
<body>                                         
    <h1>lets start</h1>
    <p>this is<b> python life</b></p>
    <p>this is<mark> python life</mark></p>
    <p>this is<u> python life</u></p>
    <p>this is<small> python life</small></p>                                                                     
    <p>this is<sub> python life</sub></p>                                                                                                                                                  
    <p>this is<sup> python life</sup></p>               
    <p>this is<i> python life</i></p>
</body>
</html>
