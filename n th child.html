<!DOCTYPE html>
<html>
<head>
<title>Table Example</title>

<style>
/* selecting rows */
tr:nth-child(even){
background-color: rgb(195,191,191);
}

tr:nth-child(odd){
background-color: green;
}

/* selecting second column */
tr td:nth-child(2){
background-color: plum;
}
td:hover{
background-color: yellow;
}
</style>

</head>

<body>

<table border="1">

<tr>
<th>Student Name</th>
<th>Age</th>
<th>Course</th>
</tr>

<tr>
<td>Radhika</td>
<td>21</td>
<td>PFS</td>
</tr>

<tr>
<td>Madhu</td>
<td>21</td>
<td>PFS</td>
</tr>

</table>

</body>
</html>
