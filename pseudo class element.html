<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web page</title>
<style>
    pre::first-line
    {
        color: red;
        font-family: Georgia;
    }
    pre::first-letter
    {
        color: green;
        font-size: xx-large;
    }
    pre::before
    {
        content: "####";
    }
    pre::after
    {
        content: "$$$$";
        color: sienna;
    }
</style>
</head>
<body>
    
    <pre>
        HTML and CSS
        hyper text markup language
        cascading style  sheet
    </pre>
</body>
</html>
