<html>
<head>
<title>List Example</title>

<style>
ul li:first-child{
color:brown;
border:5px ridge;
}

ul li:last-child{
color:green;
border:5px groove goldenrod;
}

ul li:first-child:hover{
background-color:aquamarine;
}
</style>

</head>

<body>

<ul>
<li>Apple</li>
<li>Mango</li>
<li>Orange</li>
<li>Banana</li>
</ul>

</body>
</html>
