<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            overflow: hidden;
        }
        #box{
            border: 2px solid black;
            height: 100px;
            width: 100px;
            background-color: red;
            position: relative;
            margin: 0%;
            border-radius: 50%;
            animation-name: circle-color;
            animation-duration: 5s;
            animation-fill-mode: infinite;
        }
        @keyframes circle-color{
            from{background-color: red;}
            to{background-color: yellow; border-radius: 0%;}
            0%{
                left: 0%;
                top: 0%;
            }
            25%{
                left: 90%;
                top: 0%;
            }
            50%{
                top:80%;
                left:90%
            }
            75%{
                left: 80%;
                top:90%;
            }
            100%{
                left:0%;
                top:0%;
            }
        }
    </style>
</head>
<body>
    <div id="box"></div>
</body>
</html>
